# Production overlay: adds TLS termination in front of the app.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# The app itself stays on loopback (see docker-compose.yml); only Caddy binds
# the public ports.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
