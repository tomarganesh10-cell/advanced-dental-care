name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time only. Has no effect at runtime — the server still refuses to
  # boot in production with placeholder secrets. See src/lib/env.ts.
  SKIP_ENV_VALIDATION: "1"

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adcc
          POSTGRES_PASSWORD: adcc_ci
          POSTGRES_DB: adcc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://adcc:adcc_ci@localhost:5432/adcc_test
      TEST_DATABASE_URL: postgresql://adcc:adcc_ci@localhost:5432/adcc_test
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RAZORPAY_KEY_SECRET: ci_test_secret
      RAZORPAY_WEBHOOK_SECRET: ci_test_webhook_secret
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  content-gate:
    name: Content governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check verified claims carry evidence
        run: npx tsx scripts/check-content.ts

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # E2E is slower and less deterministic than the rest; it should not gate a
    # PR on a flake, but it must not be silently skipped either.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adcc
          POSTGRES_PASSWORD: adcc_ci
          POSTGRES_DB: adcc_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://adcc:adcc_ci@localhost:5432/adcc_e2e
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OTP_DEV_ECHO: "true"
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
