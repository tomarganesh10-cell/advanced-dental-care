services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-adcc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adcc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host. The application reaches it over the compose
    # network; exposing 5432 publicly is how clinic databases end up on Shodan.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-adcc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adcc}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Loopback only. Published on 0.0.0.0 this would serve the whole clinic over
    # plain HTTP on port 3000, alongside whatever TLS the reverse proxy adds —
    # and session cookies are Secure-only, so that endpoint cannot even log in.
    # The reverse proxy reaches the app over the compose network as `app:3000`.
    ports:
      - "127.0.0.1:3000:3000"

  # Without this, nothing is ever sent to a patient. See docs/DEPLOYMENT.md.
  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-adcc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adcc}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
